<div class="container mt-4">
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ isEditMode ? 'Edit' : 'Add' }} Student</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-6">
              <mat-form-field class="w-100 mt-3">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" placeholder="Enter student name">
                <mat-error *ngIf="studentForm.get('name')?.hasError('required')">Name is required</mat-error>
                <mat-error *ngIf="studentForm.get('name')?.hasError('minlength')">Name must be at least 2 characters</mat-error>
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <mat-form-field class="w-100 mt-3">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" placeholder="Enter student email">
                <mat-error *ngIf="studentForm.get('email')?.hasError('required')">Email is required</mat-error>
                <mat-error *ngIf="studentForm.get('email')?.hasError('email')">Enter a valid email</mat-error>
              </mat-form-field>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <mat-form-field class="w-100 mt-3">
                <mat-label>Subjects</mat-label>
                <mat-select formControlName="subjectIds" multiple>
                  <mat-option *ngFor="let subject of subjects" [value]="subject.id">
                    {{ subject.name }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>
          <div class="action-buttons mt-4">
            <button mat-button type="button" routerLink="/students">Cancel</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="studentForm.invalid">
              {{ isEditMode ? 'Update' : 'Create' }}
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
