<!-- student-list.component.html -->
<div class="container-fluid py-4">
    <div class="card shadow-sm border-0 rounded-lg">
      <!-- Header section -->
      <div class="card-header bg-white py-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h2 class="mb-0 text-primary">
              <i class="fas fa-user-graduate me-2"></i>Students
            </h2>
            <p class="text-muted mb-0">Manage all student records</p>
          </div>
          <button mat-raised-button color="primary" routerLink="/students/new" class="d-flex align-items-center">
            <mat-icon>add</mat-icon>
            <span class="ms-1">Add New Student</span>
          </button>
        </div>
      </div>
  
      <!-- Table section -->
      <div class="card-body p-0">
        <div class="table-responsive">
          <div class="mat-elevation-z0" *ngIf="students.length > 0">
            <!-- Search and filter row -->
            <div class="px-4 py-3 bg-light border-bottom">
              <div class="row g-2 align-items-center">
                <div class="col-md-6">
                  <mat-form-field appearance="outline" class="w-100 m-0">
                    <mat-label>Search students</mat-label>
                    <input matInput placeholder="Type to search..." (keyup)="applyFilter($event)">
                    <mat-icon matSuffix>Search</mat-icon>
                  </mat-form-field>
                </div>
                <div class="col-md-6 text-md-end">
                  <span class="text-muted me-2">Total: {{students.length}} students</span>
                </div>
              </div>
            </div>
            
            <!-- Data table -->
            <table mat-table [dataSource]="dataSource" class="w-100" matSort>
              <!-- ID Column -->
              <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                <td mat-cell *matCellDef="let student"> {{student.id}} </td>
              </ng-container>
          
              <!-- Name Column -->
              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                <td mat-cell *matCellDef="let student"> {{student.name}} </td>
              </ng-container>
          
              <!-- Email Column -->
              <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                <td mat-cell *matCellDef="let student"> {{student.email}} </td>
              </ng-container>
          
              <!-- Subjects Column -->
              <ng-container matColumnDef="subjects">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Subjects </th>
                <td mat-cell *matCellDef="let student">
                  <div class="subject-chips">
                    <span *ngFor="let subject of getSubjectsArray(student.subjectIds)" 
                          class="badge rounded-pill bg-light text-dark me-1">
                      {{subject}}
                    </span>
                  </div>
                </td>
              </ng-container>
          
              <!-- Actions Column -->
               
              <!-- <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="text-center" mat-sort-header> Actions </th>
                <td mat-cell *matCellDef="let student" class="text-center">
                  <button mat-icon-button color="primary" matTooltip="Edit" [routerLink]="['/students/edit', student.id]">
                    <mat-icon>edit</mat-icon>
                  </button>
                
                  <button mat-icon-button color="warn" matTooltip="Delete" (click)="confirmDelete(student)">
                    <mat-icon>delete</mat-icon>
                  </button>
                </td>
              </ng-container> -->

              <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="text-center" mat-sort-header>Actions</th>
                <td mat-cell *matCellDef="let student" class="text-center">
                  <!-- Bootstrap Edit Button -->
                  <a [routerLink]="['/students/edit', student.id]" class="btn btn-sm btn-primary me-1">
                    Edit
                  </a>
              
                  <!-- Bootstrap Delete Button -->
                  <button class="btn btn-sm btn-danger" (click)="confirmDelete(student)">
                    Delete
                  </button>
                </td>
              </ng-container>
              
          
              <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="student-row"></tr>
            </table>
            
            <!-- Pagination -->
            <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 50]" 
                           showFirstLastButtons></mat-paginator>
          </div>
        </div>
        
        <!-- Empty state -->
        <div *ngIf="students.length === 0" class="text-center py-5">
          <div class="empty-state">
            <mat-icon class="empty-icon">school</mat-icon>
            <h3 class="mt-3">No Students Found</h3>
            <p class="text-muted">Start by adding your first student to the system.</p>
            <button mat-raised-button color="primary" routerLink="/students/new" class="mt-2">
              <mat-icon>add</mat-icon> Add New Student
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
