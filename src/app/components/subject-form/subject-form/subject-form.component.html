<div class="container mt-4">
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ isEditMode ? 'Edit' : 'Add' }} Subject</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="subjectForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-6">
              <mat-form-field class="w-100 mt-3">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" placeholder="Enter subject name">
                <mat-error *ngIf="subjectForm.get('name')?.hasError('required')">Name is required</mat-error>
                <mat-error *ngIf="subjectForm.get('name')?.hasError('minlength')">Name must be at least 2 characters</mat-error>
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <mat-form-field class="w-100 mt-3">
                <mat-label>Teacher</mat-label>
                <mat-select formControlName="teacherId">
                  <mat-option [value]="null">None</mat-option>
                  <mat-option *ngFor="let teacher of teachers" [value]="teacher.id">
                    {{ teacher.name }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>
          <div class="action-buttons mt-4">
            <button mat-button type="button" routerLink="/subjects">Cancel</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="subjectForm.invalid">
              {{ isEditMode ? 'Update' : 'Create' }}
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
